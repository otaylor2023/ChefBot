# Baseline (spec §15): P1 · O1 · V1-full · top+side · T1 "grasp the cup" · C-ind · M-claude · prompt v1.
name: base
representation: p1          # p1 (A, B, F) | p2 (A, B) | b0 (numeric, camera images) | r_gt | r_heur
output: o1                  # o1 axis meters | o2 pixels
render: v1                  # v1 point cloud | v4 realistic ortho render
geometry: full              # full (GT mesh cloud) | partial (masked depth)
trajectory: t1              # t1 grasp only | t3 pre-grasp, grasp, lift
views: ind                  # ind (one call, both views) | seq (top, then side with guide lines)
model: claude               # see models.yaml
prompt_version: v1
repeats: 3
temperature: 0.7
max_tokens: 4000
image_size: 1024
