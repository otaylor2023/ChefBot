# Kitchen tools: what a step needs in hand, independent of any robot.
# mentioned: matched in the step's own quote (word boundary, case-insensitive, optional plural "s"/"es").
# implied:   a verb (or verb/style) that needs the tool even when the text doesn't name it.
version: 1
lexicon:
  knife: [knife, knives, cleaver]
  cutting board: [cutting board, chopping board]
  whisk: [whisk]
  spatula: [spatula, turner]
  wooden spoon: [wooden spoon]
  spoon: [spoon]   # word boundary: "1 tablespoon" / "teaspoon" do not match
  slotted spoon: [slotted spoon]
  ladle: [ladle]
  tongs: [tongs]
  rolling pin: [rolling pin]
  grater: [grater, microplane, box grater]
  zester: [zester]
  peeler: [peeler]
  masher: [masher, potato masher]
  strainer: [strainer, sieve, colander, fine-mesh]
  blender: [blender, immersion blender, stick blender]
  food processor: [food processor]
  stand mixer: [stand mixer, dough hook, paddle attachment]
  hand mixer: [hand mixer, electric mixer]
  measuring cup: [measuring cup]
  measuring spoon: [measuring spoon]
  scale: [scale, kitchen scale]
  thermometer: [thermometer, instant-read]
  pastry brush: [pastry brush, brush]
  bench scraper: [bench scraper, dough scraper, bowl scraper]
  parchment: [parchment, baking paper]
  plastic wrap: [plastic wrap, cling film]
  foil: [foil]
  kitchen towel: [kitchen towel, tea towel, paper towel]
  wire rack: [wire rack, cooling rack]
  timer: [timer]
implied:
  cut: [knife, cutting board]
  cut/grate: [grater]
  cut/zest: [zester]
  cut/peel: [peeler]
  beat: [whisk]
  mix/whisk: [whisk]
  mix: [spoon]
  cook/stir: [spatula]
  cook/scramble: [spatula]
  cook/saute: [spatula]
  cook/fry: [spatula]
  blend: [blender]
  drain: [strainer]
  measure: [measuring cup]
