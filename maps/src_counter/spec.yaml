# The SRC kitchen test area around Jack's counter top, in the mocap (Motive) world frame, z up. 2026-11-03.
#
# counter: from the Motive rigid body `Chef-botcounter-top` (4 markers on its corners, ID 25), tracked 717/721 frames,
#   marker error 0.03 mm; `real_map body runs/counter/probe_20261103.log Chef-botcounter-top`. Box covering the markers
#   (both readings of the y-up/z-up mirror), markers 0.93 m up. Re-run `body` when the markers are back if it moved.
#
# bounds: PROVISIONAL, NOT MEASURED. The counter plus ~1 m all round, and the places the base has been today.
#   Replace with the room's real free floor (walls, cabinets, the Motive table) before driving outside known space.
resolution: 0.05
# xmax, ymax: WALLS (Jack, 2026-11-03, "roughly"): 53 in (1.35 m) past the counter's east end -> x 3.97; 6 ft (1.83 m)
#   behind its far side -> y 4.37; each taken 5 cm closer for the "roughly". xmin, ymin: the open west end and near side
#   (ymin: HT-3b's known floor).
bounds: [[-1.40, -0.05], [3.92, 4.32]]
obstacles:
  - name: Chef-botcounter-top
    box: {center: [1.49, 2.06], size: [2.26, 0.96], yaw_deg: 0.0}
    height_m: 0.93   # its top (the corner markers' centres): a low obstacle, the arm may pass over it
stations:
  # Square to the counter's sides, from its box: base centre 0.45 m out from each edge's middle (the closer lap's distance,
  # HT-4c), facing it, the last 0.25 m straight in along the edge's normal.
  - {obstacle: Chef-botcounter-top, prefix: counter, standoff: 0.45, approach: 0.25}
places:
  # base poses (x, y, yaw); the base faces yaw (the way the arm faces)
  near_side: {x: 1.49, y: 1.00, yaw_deg: 90}       # in front of the counter's -y long side, facing it
  west_end: {x: -0.25, y: 2.06, yaw_deg: 0}        # off its -x end, facing it (0.61 m out: clears a stowed arm)
  far_side: {x: 1.49, y: 3.05, yaw_deg: -90}       # behind its +y long side, facing it (goes around)
  east_end: {x: 3.10, y: 2.06, yaw_deg: 180}       # off its +x end, facing it
  # Hugging the near (-y) side with the arm as it stands (footprint 0.56 + margin 0.10 = 0.66, + grid rounding):
  # base centre 0.72 m from the counter edge (y 1.58), facing along it (+x) so the arm never points at it.
  hug_a: {x: 0.50, y: 0.86, yaw_deg: 0}
  hug_b: {x: 1.49, y: 0.86, yaw_deg: 0}
  hug_c: {x: 2.40, y: 0.86, yaw_deg: 0}
  # The lap (HT-4b): 0.65 m from each edge (footprint 0.55 + margin 0.05 + 0.05), facing the counter on each side.
  lap_near: {x: 1.49, y: 0.93, yaw_deg: 90}
  lap_east: {x: 3.27, y: 2.06, yaw_deg: 180}
  lap_far: {x: 1.49, y: 3.19, yaw_deg: -90}
  lap_west: {x: -0.29, y: 2.06, yaw_deg: 0}
  # A closer lap (HT-4c): base footprint 0.33 against the counter when the arm is higher than it; 0.45 m out.
  close_near: {x: 1.49, y: 1.13, yaw_deg: 90}
  close_east: {x: 3.07, y: 2.06, yaw_deg: 180}
  close_far: {x: 1.49, y: 2.99, yaw_deg: -90}
  close_west: {x: -0.09, y: 2.06, yaw_deg: 0}
