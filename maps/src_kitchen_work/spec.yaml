# The SRC kitchen to work in: maps/src_kitchen's spec as Jack measured it (2026-11-05: the counters from Motive rigid
# bodies, the provisional bounds, the no-go west of the island; heading_zones.yaml the same), with only the places the
# base can stand at: 8 of src_kitchen's 20 (the rest are in a wall, an obstacle or the 10 cm margin, checked 2026-11-06
# with real_nav's planner and the arm at READY). Keep the obstacles in step with maps/src_kitchen/spec.yaml.
# The north side (far_counter_west, island_north) and the south aisle (island_south, stove_counter_north, counter_north)
# join only through the fridge aisle, where the base faces along it: north to south plans, south to north does not.
# Build: python -m chefbot.environments.real.build_map build maps/src_kitchen_work/spec.yaml
resolution: 0.05
# PROVISIONAL bounds: the floor the base may use. Not measured yet (Jack measures the walls next). ymin sits just behind
# the L counter's back edges (assumed against walls): ymin -4.95 behind leg 1, xmax 4.60 behind leg 2 and the far counter;
# xmin, ymax as in maps/src_counter.
bounds: [[-2.00, -4.95], [4.60, 4.32]]
obstacles:
  - name: kitchen_island_countertop     # Motive body ID 26: 4 corner markers, measured 2026-11-05 12:59
    box: {center: [1.305, -2.087], size: [2.224, 0.961], yaw_deg: -2.96}
    height_m: 0.91
    fixture: island
  # The L counter (Jack, 2026-11-05): leg 1 along the south with the stove (Motive body 27), leg 2 along the east joined
  # to it at the corner (body 28, "2-corner-connected-1-and-fridge"), ending in the fridge. Leg 2's depth is assumed
  # equal to leg 1's (0.632 m; its back edge has no markers).
  - name: 1-corner-countertop           # leg 1, body 27: 15 markers (front edge, back edge, stove end), 13:12
    box: {center: [1.936, -4.638], size: [3.826, 0.632], yaw_deg: -2.96}
    height_m: 0.83
    fixture: stove_counter
  - name: 2-corner-connected-1-and-fridge   # leg 2, body 28: front edge at kitchen-x 3.68, from the corner to the fridge
    box: {center: [3.816, -3.556], size: [0.632, 2.987], yaw_deg: -2.96}
    height_m: 0.84
    fixture: side_counter
  - name: fridge                        # leg 2's north end, body 28's markers at 1.78-1.79 m high
    box: {center: [3.919, -1.570], size: [0.632, 0.990], yaw_deg: -2.96}
    height_m: 1.80
    fixture: fridge
  - name: far-counter                   # body 29: 5 markers, the east side north of the fridge, 13:25
    box: {center: [4.198, 0.560], size: [0.566, 3.296], yaw_deg: -2.96}
    height_m: 0.88
    fixture: far_counter
  # NO-GO (Jack, 2026-11-05): the floor west of the island, "underneath" the U of aisles when drawn with +x up. From
  # the map's west edge to the island's west end, across the U's width (leg 1's front to the fridge's north end). Tall:
  # (now floor level: the plate stays out, the arm may cross in). The U itself (the island's north, east and south aisles) is
  # where the robot works.
  - name: nogo-west-of-island
    box: {center: [-1.434, -2.473], size: [2.191, 3.345], yaw_deg: -2.96}  # east edge 20 in (0.508 m) west of the island's end (Jack 16:15; was 16 in)
    height_m: 0.05   # floor level (Jack 14:15): the base's plate may not enter, the arm may reach over it
  - name: Chef-botcounter-top           # the test counter (HT-4..6), from its 4 corner stickers (2026-11-06 21:00:
    # (0.37, 1.70), (2.58, 1.59), (2.62, 2.42), (0.41, 2.53), tops 0.94-0.95); was maps/src_counter's (1.49, 2.06), 2.26 x 0.96, 0 deg
    box: {center: [1.495, 2.06], size: [2.213, 0.831], yaw_deg: -2.85}
    height_m: 0.93
    fixture: counter
stations:
  - {obstacle: kitchen_island_countertop, prefix: island, standoff: 0.45, approach: 0.25, sides: [north, south]}
  - {obstacle: 1-corner-countertop, prefix: stove_counter, standoff: 0.45, approach: 0.25, sides: [north]}
  # Chef-botcounter-top (the test counter): no places for now (2026-11-06); still an obstacle
  - {obstacle: far-counter, prefix: far_counter, standoff: 0.45, approach: 0.25, sides: [west]}
