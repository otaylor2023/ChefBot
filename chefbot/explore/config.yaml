# Exploration (chefbot/explore): what "explored" means and what detect() looks for.

# Fixtures with a door: explored only once you have looked inside with the door open.
open_labels: [fridge, microwave, dishwasher, oven, cabinet, drawer]

# A detect counts as looking at a fixture if the fixture is this close and in front.
look_range: 1.5             # m
look_half_angle_deg: 60

# Scoring: an object found this close (xy) to where it really is counts as found there.
location_tolerance: 0.15    # m: a detector sees the middle of an object; the map builder records its body origin, which can sit off it (a pan's, toward the handle)

# detect() with no classes looks for all of these (and the handles of doors to open).
# A fixed list of kitchen nouns, not the scene's: the vision detector replaces it
# with open vocabulary.
vocab_file: vocab.yaml

# The vision detector (explore/vision.py, --detector vision): loose objects come
# from the robot's camera image, named by a vision language model; fixtures and
# their parts (handles, burners) stay with the scene's fixture geometry, which
# the starting map already gives.
vision:
  camera: robot0_frontview
  model: anthropic/claude-sonnet-5.5   # OpenRouter id; must take images
  max_range: 4.0                       # m: farther points are dropped
  synonyms:                            # VLM word -> catalogue label
    water bottle: bottled water
    bottle of water: bottled water
    chopping board: cutting board
    frying pan: pan
    skillet: pan
    coffee mug: mug
    cup of coffee: mug
    eggs: egg
