# Exploration (chefbot/explore): what "explored" means and what detect() looks for.

# Fixtures with a door: explored only once you have looked inside with the door open.
open_labels: [fridge, microwave, dishwasher, oven, cabinet, drawer]

# A detect counts as looking at a fixture if the fixture is this close and in front.
look_range: 1.5             # m
look_half_angle_deg: 60

# Cabinets and drawers on the map (a task's storage: true): one whose floor is above the
# robot's camera (1.65 m) cannot be looked into from the robot, so it is not explored.
storage_max_bottom: 1.6     # m

# Scoring: an object found this close (xy) to where it really is counts as found there.
location_tolerance: 0.15    # m: a detector sees the middle of an object; the map builder records its body origin, which can sit off it (a pan's, toward the handle)

# detect() with no classes looks for all of these (and the handles of doors to open).
# A fixed list of kitchen nouns, not the scene's: the vision detector replaces it
# with open vocabulary.
vocab_file: vocab.yaml

# The vision detector (explore/vision.py, --detector vision): loose objects come
# from the robot's camera image, named by a vision language model; fixtures and
# their parts (handles, burners) stay with the scene's fixture geometry, which
# the starting map already gives.
vision:
  camera: robot0_frontview
  cameras: [robot0_frontview, robot0_agentview_left, robot0_agentview_right]  # per view, the one the arm blocks least
  model: anthropic/claude-sonnet-5.5   # OpenRouter id; must take images
  max_range: 4.0                       # m: farther points are dropped
  edge_margin: 8        # px: boxes this close to the image border are cut off, so skipped
  merge_radius: 0.3    # m: same-label sightings this close are one object (position = their mean)
  height_range: [0.2, 2.2]  # m: where loose objects can sit
  footprint_margin: 0.1  # m: points must fall over a fixture footprint, give or take this
  conflict_radius: 0.08  # m: two differently named objects this close may be one thing...
  closer_by: 0.5         # m: ...and the name from a view at least this much closer wins (label_vote off)
  label_vote: true       # ...or: the name seen most often on the spot wins (ties: higher summed score)
  refine_small: false    # look again at small boxes: the detector on an enlarged crop around each
  refine_small_px: 1000  # px: boxes smaller than this (area) are looked at again
  refine_context: 3.0    # crop side, in box sizes
  refine_side: 384       # px: the crop is enlarged to this side
  same_view_diff: 1.0    # a view this close to the last one (mean abs pixel difference) reuses its answer
  max_cost_usd: 0.60     # the VLM stops being called once a run has spent this much (OpenRouter cost)
  use_aliases: false      # report a near-synonym group's name (aliases above)
  alias_merge_radius: 0.12  # m: with aliases, a group name's sightings this close are one object (a cup and a mug can sit side by side)
  check_px: 1000           # px (area): boxes smaller than this go to the detector's checker (owl.sam3_check)
  check_score: 0.3         # ...and boxes scored below this
  approach_small: false  # go closer: objects only seen small are flagged in detect, and the route approaches them
  approach_small_px: 1000  # px: a box this small (area) is "seen small"
  approach_distance: 0.7   # m: stand this far from it to look again
  approach_per_stop: 2     # at most this many approaches after each fixture or cabinet group
  look_closely: false    # look at uncertain objects (small, low score, two names on one spot, only ever partly hidden)
                         # with the wrist camera from close by (explore/look.py); the route goes there like approach_small
  appearance_signature: false  # pass each box's SigLIP 2 image embedding on as its signature, so the object memory
                                # tells like things apart (five forks); needs owl.hybrid_siglip (local, free)
  close_distance: 0.32   # m: wrist camera to object
  close_elevation_deg: 50  # looking down at it this much
  close_dip_deg: 28      # the camera aims this much below it, so it sits above the gripper in the picture
  close_sides_deg: [0, 30, -30]  # straight on, then from the left and right if no arm pose fits or it is still partly hidden
  close_range: 0.6       # m: a sighting from this close is a close view: its position wins...
  close_weight: 3        # ...and its name counts this many times in the name vote
  uncertain_score: 0.3   # an object whose mean box score is below this is uncertain
  occluded_share: 0.25   # a box with this share of its pixels on a nearer surface (by occluded_gap) is partly hidden
  occluded_gap: 0.04     # m
  robot_share: 0.3       # in a close view, a box with this share of its pixels on the robot is its own gripper
  close_names_all: true  # in a close view, a hybrid detector (owl.hybrid_siglip) names every box with SigLIP 2:
                         # close up everything is big, and OWLv2 names a single object filling the box poorly
  move_occluders: false  # after looking closely from every side, an object still partly hidden: pick what is in front
                         # of it, set it down on a free spot nearby, look again, put it back (explore/move_aside.py;
                         # grasp and placement from the robot's own depth points, no ground truth)
  synonyms:                            # VLM word -> catalogue label
    water bottle: bottled water
    bottle of water: bottled water
    chopping board: cutting board
    frying pan: pan
    skillet: pan
    coffee mug: mug
    cup of coffee: mug
    eggs: egg

# Near-synonyms in the word list, as one name (explore/aliases.py): the detector reports the group's
# name (vision.use_aliases), and the scorer and accuracy report compare names by group.
aliases:
  mug: [cup, coffee cup, glass cup]
  pan: [saucepan, frying pan, skillet]
  lemon: [lime, lemon wedge]
  bottled water: [water bottle, bottled drink]

# The OWLv2 detector (explore/owl.py, --detector owl): the vision pipeline above with an
# off-the-shelf open-vocabulary detector naming and boxing objects instead of the VLM.
owl:
  model: google/owlv2-base-patch16-ensemble   # Hugging Face id, downloaded once (~600 MB)
  threshold: 0.2        # min score of a box's best-matching name
  nms_iou: 0.3          # boxes overlapping a better one this much are the same object
  prompt: "a photo of a {name}"
  hybrid_siglip: false  # name boxes under hybrid_px with SigLIP 2 (better on small things), the rest with OWLv2
  hybrid_px: 1000       # px (area)
  siglip_model: google/siglip2-so400m-patch14-384
  sam3_check: false     # SAM 3 checks small or low-score boxes: SigLIP 2's top 3 names, a clearly better mask fit renames the box
  sam3_model: facebook/sam3   # gated: a Hugging Face login with Meta's license accepted
  sam3_margin: 0.15     # SAM 3 renames a box only when the new name's mask fits this much better than its own
  sam3_drop: false      # a box no candidate's mask fits: false keeps it with its name, true drops it
  fixture_queries: true # also query fixture words; a box they win is a kitchen part, not an object
