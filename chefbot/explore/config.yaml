# Exploration (chefbot/explore): what "explored" means and what detect() looks for.

# Fixtures with a door: explored only once you have looked inside with the door open.
open_labels: [fridge, microwave, dishwasher, oven, cabinet, drawer]

# A detect counts as looking at a fixture if the fixture is this close and in front.
look_range: 1.5             # m
look_half_angle_deg: 60

# Cabinets and drawers on the map (a task's storage: true): one whose floor is above the
# robot's camera (1.65 m) cannot be looked into from the robot, so it is not explored.
storage_max_bottom: 1.6     # m

# Scoring: an object found this close (xy) to where it really is counts as found there.
location_tolerance: 0.15    # m: a detector sees the middle of an object; the map builder records its body origin, which can sit off it (a pan's, toward the handle)

# detect() with no classes looks for all of these (and the handles of doors to open).
# A fixed list of kitchen nouns, not the scene's: the vision detector replaces it
# with open vocabulary.
vocab_file: vocab.yaml

# The vision detector (explore/vision.py, --detector vision): loose objects come
# from the robot's camera image, named by a vision language model; fixtures and
# their parts (handles, burners) stay with the scene's fixture geometry, which
# the starting map already gives.
vision:
  camera: robot0_frontview
  cameras: [robot0_frontview, robot0_agentview_left, robot0_agentview_right]  # per view, the one the arm blocks least
  model: anthropic/claude-sonnet-5.5   # OpenRouter id; must take images
  max_range: 4.0                       # m: farther points are dropped
  edge_margin: 8        # px: boxes this close to the image border are cut off, so skipped
  merge_radius: 0.3    # m: same-label sightings this close are one object (position = their mean)
  height_range: [0.2, 2.2]  # m: where loose objects can sit
  footprint_margin: 0.1  # m: points must fall over a fixture footprint, give or take this
  conflict_radius: 0.08  # m: two differently named objects this close may be one thing...
  closer_by: 0.5         # m: ...and the name from a view at least this much closer wins (label_vote off)
  label_vote: true       # ...or: the name seen most often on the spot wins (ties: higher summed score)
  refine_small: false    # look again at small boxes: the detector on an enlarged crop around each
  refine_small_px: 1000  # px: boxes smaller than this (area) are looked at again
  refine_context: 3.0    # crop side, in box sizes
  refine_side: 384       # px: the crop is enlarged to this side
  synonyms:                            # VLM word -> catalogue label
    water bottle: bottled water
    bottle of water: bottled water
    chopping board: cutting board
    frying pan: pan
    skillet: pan
    coffee mug: mug
    cup of coffee: mug
    eggs: egg

# The OWLv2 detector (explore/owl.py, --detector owl): the vision pipeline above with an
# off-the-shelf open-vocabulary detector naming and boxing objects instead of the VLM.
owl:
  model: google/owlv2-base-patch16-ensemble   # Hugging Face id, downloaded once (~600 MB)
  threshold: 0.2        # min score of a box's best-matching name
  nms_iou: 0.3          # boxes overlapping a better one this much are the same object
  prompt: "a photo of a {name}"
  fixture_queries: true # also query fixture words; a box they win is a kitchen part, not an object
