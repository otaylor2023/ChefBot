# A small kitchen for the symbolic env: a wall of fixtures along y = 0 facing
# into the room (+y), and an island with a table and appliances along y = 3.6
# facing back (-y). Locations are the middle of each fixture's top (m).
fixtures:
  fridge:        {location: [0.5, 0.35],  facing: [0, 1],  width: 0.8, height: 1.2}
  counter_1:     {location: [1.7, 0.3],   facing: [0, 1],  width: 1.4}
  stove:         {location: [2.9, 0.3],   facing: [0, 1],  width: 0.8, burners: [front_left, front_right, back_left, back_right]}
  counter_2:     {location: [4.1, 0.3],   facing: [0, 1],  width: 1.4}
  sink:          {location: [5.3, 0.3],   facing: [0, 1],  width: 0.8}
  trash_can:     {location: [6.1, 0.35],  facing: [0, 1],  width: 0.4, height: 0.7, kind: trash can}
  cabinet_1:     {location: [1.0, 3.6],   facing: [0, -1], width: 0.8}
  cabinet_2:     {location: [1.9, 3.6],   facing: [0, -1], width: 0.8}
  table:         {location: [3.2, 3.5],   facing: [0, -1], width: 1.6, height: 0.75}
  toaster:       {location: [4.5, 3.6],   facing: [0, -1], width: 0.4}
  microwave:     {location: [5.2, 3.6],   facing: [0, -1], width: 0.6}
