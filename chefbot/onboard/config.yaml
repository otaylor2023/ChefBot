# The onboard server on the robot computer (tidybot01). Lengths in meters.

server:
  host: 127.0.0.1        # reached through `ssh -L 8765:localhost:8765 tidybot01`
  port: 8765
  state_hz: 50
  watchdog_s: 0.3        # silence from a client that has been commanding: hold the arm, stop the base
  camera_idle_s: 10      # close a camera after this long without a request

redis:
  host: 127.0.0.1
  port: 6379

base:
  # The hb1 driver's speed: the robot's hard base cap, embodiments/tidybot_fr3/robot.yaml control.limits (its one copy;
  # interface/limits.py reads it, here and on the laptop).
  # The mocap rigid body on the base (chefbot-tidy): its yaw relative to the base's heading, and its origin's
  # position in the base frame. Its x runs along the base (the markers are symmetric about it), forward by the
  # operator's account (the six markers at the front, the lone pair at the back).
  # Measured 2026-11-03 (HT-1a, docs/hardware-tests.md): driven by hand forward / back / left / right and spun
  # 379 deg in place; `python -m chefbot.onboard.calibration.base solve`. The four moves' offsets agree within
  # 0.6 deg; with these the base centre stays within 1.4 mm rms through the spin. Re-measure if the rigid body
  # is re-created in Motive or the markers move. Motive streams z up (frames.py's yaw).
  marker_yaw_offset_deg: 3.14
  marker_xy: [0.072, -0.002]
  # The mocap pose counts as live only if it changed within this long (onboard/mocap.py: the publisher writes no
  # timestamp, and its last values outlive it in Redis). Many missed frames at Motive's rate (measure it: stage 0 test).
  mocap_stale_s: 0.25

gripper:
  speed: 0.05            # m/s
  force: 20.0            # N, when closing on an object

# Told to the client in "hello" next to the base cap (the server adds it from interface/limits.py).
limits:
  # The base's measured stop, from the last fresh command to rest (the driver's timeout included), as
  # d(v) = v * tau + v^2 / (2 * brake): the client never drives faster than it can stop in the free space ahead.
  # HT-4d (2026-11-03): 78 mm from 0.131 m/s with the driver's 0.3 s timeout and 0.25 m/s^2 braking. Re-measure
  # (SIGSTOP the server mid-move, docs/hardware-tests.md) whenever the driver's speed, braking or timeout change.
  base_stop_tau_s: 0.333
  base_stop_brake_mps2: 0.25

# The RealSenses (serials: `rs-enumerate-devices -s`).
cameras:
  - {name: wrist, serial: "323622271565", width: 640, height: 480, fps: 15}   # D405
  - {name: pole, serial: "049122252230", width: 640, height: 480, fps: 15}    # D455
