# Robot layer: footprint, control, goal handling, IK.
# Lengths in meters, angles in degrees, time in seconds.

footprint_radius: 0.43      # circle enclosing the base (PandaOmron: 0.70 x 0.50 m box)
safety_margin: 0.03         # added to the footprint when inflating the grid

# Arm base frame expressed in the base frame (origin on the floor under the
# base center, x forward). Measured on RoboCasa's PandaOmron; change for TidyBot++.
arm_mount:
  xyz: [0.21, 0.0, 0.7]
  yaw_deg: 0.0
tcp_offset: 0.16            # flange -> fingertip of the Robotiq 2F-85 (0.160 m in the Menagerie model)

control_rate: 20            # Hz
gains:
  kp_pos: 2.0
  kp_yaw: 2.5
limits:
  max_lin_vel: 0.5          # m/s
  max_ang_vel: 1.0          # rad/s
  max_lin_acc: 1.0          # m/s^2
  max_ang_acc: 2.0          # rad/s^2
tolerances:
  pos: 0.015
  yaw_deg: 1.5
lookahead: 0.3              # carrot distance along the path
deviation_threshold: 0.2    # distance off the path that counts as blocked
motion_timeout_s: 60

snap_radius: 0.5            # go_to_pose: how far a goal in collision may be moved
standoff:                   # align_to_point: candidate rings around the target
  min: 0.5
  max: 1.1
  rings: 7
  angles: 24

ik:
  pos_tolerance: 0.01
  max_iters: 150
  dt: 0.1
  damping: 0.001
