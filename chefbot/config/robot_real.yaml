# The real robot (tidybot01): TidyBot++ base, FR3, Franka Hand. Everything not set here is
# robot.yaml's; maps are merged key by key, lists replaced.
extends: robot.yaml

hardware:
  arm: fr3
  gripper: franka_hand

# TODO(measure): the TidyBot++ footprint and where the FR3's base sits on it. Until then these are
# the sim robot's, so keep the base slow and well clear of things.
footprint_radius: 0.43
arm_mount:
  xyz: [0.21, 0.0, 0.7]
  yaw_deg: 0.0

# Slow to start: the base as ZitiBot ran it (hb1 driver defaults), the arm well under OpenSai's caps.
limits:
  max_lin_vel: 0.125
  max_ang_vel: 0.4
  max_lin_acc: 0.1
  max_ang_acc: 0.5
arm:
  max_joint_vel: 0.5
  max_joint_acc: 1.0
  cart_speed: 0.05
  cart_acc: 0.2

# No collision checking of arm motion until the RealSenses are set up and calibrated.
planning:
  cameras: []
