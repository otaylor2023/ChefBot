# The cooking agent: plans a job's steps and works through them with the robot's tools, one tool call
# per turn, checking each step's done_when (AGENT_SPEC). Goals and thresholds only: no robot geometry
# lives here. Lengths in meters.

name: kitchen_planner
harness: plan_loop          # agent/harnesses/plan_loop: the loop it runs in
interfaces: [robot-api-v1]  # the robot APIs it runs with (robot-api-v1: interface/robot_api.py)
prompts: prompts            # system.md, plus a section per kind of tool offered (context.py PROMPT_SECTIONS)
skills:                     # the skills it gets (chefbot/skills), of those that fit the session's env and interface
  include: ["*/robotapi_v1"]  # the robot-moving tools: go_to, align, pick, ...
tools:                      # the tools it gets from chefbot/tools (the ones that do not move the robot)
  - detect                  # perception
  - nearby
  - holding
  - get_pose
  - wait                    # motion
  - get_status
  - stop
  - complete                # plan
  - set_status
  - add_step
  - skip_step
  - request_replan
  - finish
  - set_timer               # time
  - cancel_timer
  - watch

# -- The tools' settings (AgentConfig) -----------------------------------------
settings:
  approach_distance: 1.0      # go_to: how far in front of a fixture's location to stand
  nearby_radius: 2.5          # what counts as "nearby" in nearby() and in detect's map query
  max_align_distance: 2.0     # align: backstop; farther than this means go_to first
  map_match_radius: 0.75      # detect: max distance between a detection and its map entry
  refine_radius: 0.15         # align: max distance between a re-detection and the stored position

  default_vocab:              # detect() with no classes
    - burner
    - pan
    - pot
    - bowl
    - plate
    - cup
    - knife
    - spatula
    - fridge handle
    - microwave handle
    - cabinet handle
    - drawer handle
    - faucet

# -- The agent loop (AGENT_SPEC §10) -------------------------------------------
loop:
  model: anthropic/claude-sonnet-5.5        # OpenRouter model id; key from OPENROUTER_API_KEY or .env
  judge_model: anthropic/claude-haiku-5.5   # StateChecker
  provider: {order: [anthropic], allow_fallbacks: false}   # pin the provider for reproducibility
  judge_temperature: 0.0
  time_mode: paused          # paused: sim time stops while the LLM thinks; realtime: it keeps running
  window_n: 8                # tool calls kept in the rolling window
  max_reprompts: 2           # text-only replies in a row before it counts as an error
  stale_after_calls: 5       # perception: possibly stale after this many calls
  stale_move_m: 0.05         # ... or after the base moved this far / turned this much
  stale_turn_deg: 5.0
  clear_move_m: 0.5          # perception cleared after the base moved this far / turned this much
  clear_turn_deg: 30.0
  empty_burner_s: 30.0       # safety: a lit burner with nothing on it is turned off after this
  max_turns: 150
  max_llm_cost_usd: 5.0
  max_sim_time_s: 1800
  max_wall_time_s: 3600
  max_consecutive_errors: 5  # the same error this many times in a row ends the run
  log_full_requests: true    # write every LLM request + response to runs/<run>/requests/
