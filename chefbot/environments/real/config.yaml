# RealEnv: the real robot through the onboard server. The robot itself (arm, gripper, limits) is
# config/robot_real.yaml; the onboard server's side is chefbot/onboard/config.yaml.

url: ws://127.0.0.1:8765     # after `ssh -L 8765:localhost:8765 tidybot01`
velocity_horizon_s: 0.5      # a base velocity command becomes a pose target this far ahead
heartbeat_s: 0.1             # keep-alive while nothing else is sent (the server's watchdog is 0.3 s)
max_state_age_s: 0.5         # older than this, get_state fails: the link is down

# Camera mounts: the camera (OpenCV axes: x right, y down, z forward) in its parent's frame,
# parent "base" (floor under the base center, x forward) or "flange". Names match the onboard
# config's cameras.
cameras:
  # The wrist D405 (onboard/calibration/wrist.py, 2026-11-03: 18 poses at 0.4-0.64 m, 4.0 px rms, the marker's
  # black square measured 70 mm): 61.5 deg about the flange's z, its view axis 1.2 deg off the flange's z; across
  # that axis good to ~2 mm, along it (19.5 mm) to ~6 mm per mm the measured size is off.
  wrist:
    parent: flange
    T: [[0.47729, -0.87865, -0.01297, 0.03757],
        [0.87848, 0.47746, -0.01743, -0.04361],
        [0.02151, -0.00308, 0.99976, 0.01946],
        [0, 0, 0, 1]]
  # TODO(calibrate): the pole D455 (049122252230), parent base.
