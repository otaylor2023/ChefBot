# Evaluation (memory across runs, after MessyMem's long-horizon sequence without a reset): task A then task B in one kitchen.
# A: the robot puts the plate away.
name: seq_plate_A
goal: "The plate in cabinet_1, closed"
prompt: "Put the plate away in cabinet_1."
steps:
  - {id: s1, goal: "Put the plate in cabinet_1 and close it", done_when: "the plate is inside cabinet_1 and cabinet_1 is closed"}
symbolic:
  objects:
    - {name: plate, on: counter_2}
  success:
    require: ["plate: inside cabinet_1"]
    forbid: ["cabinet_\\d: open"]
