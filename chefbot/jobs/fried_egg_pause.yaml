name: fried_egg_pause
goal: "A fried egg served on a plate on the table, and the table cleared of the dishes onto counter_2"
steps:
  - id: s1
    goal: "Put the pan on a burner"
    done_when: "the pan is on a burner"
  - id: s2
    goal: "Get the egg from the fridge into the pan, and close the fridge"
    done_when: "the egg is inside the pan and the fridge is closed"
    depends_on: [s1]
  - id: s3
    goal: "Cook the egg until the whites are set (not overcooked)"
    done_when: "the egg is inside the pan, the pan is on a burner that is on, and the egg is cooked through (its cook state is 'set', not 'raw' or 'cooking')"
    depends_on: [s2]
    hint: "takes about 3 minutes on a lit burner and overcooks after about 6; watch it"
  - id: s4
    goal: "Clear the table: move the mug, the bowl and the cutting board to counter_2"
    done_when: "the mug, the bowl and the cutting board are all on counter_2"
  - id: s5
    goal: "Put a plate on the table"
    done_when: "a plate is on the table"
    depends_on: [s4]
  - id: s6
    goal: "Turn off the burner"
    done_when: "every burner is off"
    depends_on: [s3]
  - id: s7
    goal: "Serve the egg on the plate"
    done_when: "the egg is on the plate and the plate is on the table"
    depends_on: [s3, s5]
symbolic:
  objects:
    - {name: egg, in: fridge}
    - {name: pan, on: counter_2}
    - {name: plate, on: counter_1}
    - {name: mug, on: table}
    - {name: bowl, on: table}
    - {name: cutting_board, kind: "cutting board", on: table}
  success:
    require: ["egg: on plate", "plate: on table", "egg: cook state = set", "mug: on counter_2", "bowl: on counter_2", "cutting_board: on counter_2"]
    forbid: ["burner_\\w+: on", "overcooked", "fridge: open"]
