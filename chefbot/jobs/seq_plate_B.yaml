# Evaluation (memory across runs, after MessyMem's long-horizon sequence without a reset): task A then task B in one kitchen.
# B: the plate is where A put it.
name: seq_plate_B
goal: "The plate on the table"
prompt: "Put the plate on the table."
steps:
  - {id: s1, goal: "Put the plate on the table", done_when: "the plate is on the table"}
symbolic:
  objects:
    - {name: plate, on: counter_2}
  disturbances:
    - {at: start, do: move, object: plate, to: {in: cabinet_1}, note: "where task A left it (the map without memory still says counter_2)"}
  success:
    require: ["plate: on table"]
    forbid: ["cabinet_\\d: open"]
