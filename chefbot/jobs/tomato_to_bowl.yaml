# The tomato demo (run_agent --env real --agent real_kitchen): from the island to the bowl on the counter right of the
# stove, in the SRC kitchen (maps/src_kitchen_work). Where the tomato and the bowl are is not given: the agent finds
# them (find), from the map's places (its prompt lists them).
name: tomato_to_bowl
goal: "The tomato on the island is in the bowl on the counter next to the stove"
steps:
  - id: s1
    goal: "Find the tomato on the island"
    done_when: "the robot knows where the tomato is"
  - id: s2
    goal: "Pick up the tomato"
    done_when: "the tomato is held in the gripper"
  - id: s3
    goal: "Find the bowl on the counter next to the stove"
    done_when: "the robot knows where the bowl is, the tomato still held"
  - id: s4
    goal: "Put the tomato in the bowl"
    done_when: "the tomato is in the bowl and the gripper is open"
