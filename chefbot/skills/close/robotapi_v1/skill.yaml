name: close
version: robotapi_v1
entry: main.py:run
interface: robot-api-v1
envs:
- symbolic
- robocasa
sandboxed: false
robot: any
needs:
- articulate
description: >-
  Close a fixture that open works on. Same rules and errors as open.
args:
  id:
    type: string
    description: A visible id, e.g. "fridge" or "fridge handle_1".
  wait:
    type: boolean
    description: >-
      true (default): block until the motion ends and return its result. false: return immediately with
      status "moving"; follow up with wait or get_status, or cancel with stop.
    default: true
provenance:
  written: the agent's close tool (agent/tools/manip.py ManipTools.close), registered as a skill 2026-11-05
