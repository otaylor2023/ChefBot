name: tongs_lift
version: mujoco_tongs2_v17
entry: main.py:run
interface: chefbot-v1
robot: tidybot_fr3
args:
  object: {type: string, doc: "the food to lift, in a few words"}
  where: {type: string, doc: "'on the counter', 'in the bowl', 'in the pan', 'in the plate'"}
  tool: {type: string, doc: "'tongs'"}
models:
  gemini-robotics-er-2-preview: {runs: api, provider: google, key: GEMINI_API_KEY}
  gemini-3.1-flash-lite: {runs: api, provider: google, key: GEMINI_API_KEY}
  grounding-dino: {runs: vision_models}
  sam2: {runs: vision_models}
assumes: the start rule of its lab's task (tongs_pick)
privileged: false
provenance:
  lab: mujoco_tongs
  run: mujoco_tongs-1101-170005 (bohg-ws-20), the lab's second session, started from mujoco_tongs1_v34
  suite: mujoco_tongs
  test: not run; val 29.2% (24 episodes); dev 14/48 (seeds 0, 1), 37 tongs held, 3 foods broken, no hand-food contact
  report: REPORT.md; research_log.md (the run's record)
  note: no bowl or scissor-tongs successes on dev; ~44 s and ~$0.004 per episode
