name: kitchen_use
version: astra_run1_v87_fr3
entry: main.py:run
interface: chefbot-v1
robot: tidybot_fr3
arm_only: true      # the base holds where it starts (the lab's Astra chose base moves of up to 6 cm forward and 35 cm sideways: see provenance)
cameras: [wrist, pole]
args:
  object: {type: string, doc: "what to pick up, in a few words ('egg', 'saucepan lid', 'tongs')"}
  where: {type: string, doc: "where it is: 'on the counter' or 'on the utensil rest'"}
  use: {type: string, doc: "'hold'; 'squeeze' (the cracker, 1/3 in sim), 'press' (1/9), 'tongs' (0) are not reliable"}
  then: {type: string, doc: "what to do once holding it, in words ('' for hold)"}
  target: {type: string, doc: "what the use is on ('the egg in the bowl', 'bowl'; '' if nothing)"}
models:
  gpt-6-astra: {runs: codex_cli, provider: openai, auth: codex login}
assumes: the object on a surface in the cameras' view from where the arm starts (run_real --ready), within the arm's reach without the base moving; the hand wearing the printed fingers (fingers_run2_final). An episode took ~83 s of world time in sim, Astra's latency included (run_real --steps for more than the default 90 s)
privileged: false
provenance:
  lab: kitchen_use_astra (agentic-skills-exploration chefbot_labs/labs/kitchen_use_astra.yaml), the FR3 wearing the printed fingers in sim
  run: kitchen_use_astra-1105-144608 (~/ase_lab/runs), skills/final = v87, digest d90521092f9d
  results: val 11/24 (45.8%), 83 s mean world time; its corrected v42 baseline 21/36 on dev; tool uses 0/6 in the final panel; the lab's REPORT.md
  ported_from: that final, copied 2026-11-06
  changes: the real pads' middle (0.134 m from the flange (was 0.118 until the robot showed the fingers 1.6 cm further out), the hand on its 27.25 mm holder; sim 0.091, written inline 25 times, now PADS), and its move (all four policies) arriving on the arm alone (the lab's also waited for base_error < 1 cm, which a held base never meets) and taking up to 300 more steps while still progressing (was 5 or 20 six-step chunks), and its whole-body calls made arm only (arm_only.py, wrapping the robot in main.run; act's rows to act_arm in the root frame; the episode refuses act for an arm-only skill); nothing else. Astra may still choose a base move; the real host holds the base in an arm-only run, so a target beyond the arm's reach stalls
  real: "2026-11-06: the first run stopped at its first move (act refused, arm only), before arm_only.py"
