name: kitchen_use
version: run1_v155_fr3
entry: main.py:run
interface: chefbot-v1
robot: tidybot_fr3
arm_only: true      # the base holds where it starts (the lab's moved it 7 cm forward and sideways: see provenance)
cameras: [wrist, pole]  # both: the identity check compares them, and the pole can direct a closer wrist view
args:
  object: {type: string, doc: "what to pick up, in a few words ('egg', 'saucepan lid', 'tongs')"}
  where: {type: string, doc: "where it is: 'on the counter' or 'on the utensil rest'"}
  use: {type: string, doc: "'hold' (the sim's 66% on ordinary things); 'tongs', 'squeeze', 'press' are 0% in sim"}
  then: {type: string, doc: "what to do once holding it, in words ('' for hold)"}
  target: {type: string, doc: "what the use is on ('the egg in the bowl', 'bowl'; '' if nothing)"}
models:
  gemini-robotics-er-2-preview: {runs: api, provider: google, key: GEMINI_API_KEY}
  gemini-3.1-flash-lite: {runs: api, provider: google, key: GEMINI_API_KEY}
  grounding-dino: {runs: vision_models}
  sam2: {runs: vision_models}
assumes: the object on a surface in the cameras' view from where the arm starts (run_real --ready), within the arm's reach without the base moving; the hand wearing the printed fingers (fingers_run2_final)
privileged: false
provenance:
  lab: kitchen_use (agentic-skills-exploration chefbot_labs/labs/kitchen_use.yaml), the FR3 wearing the printed fingers in sim
  run: kitchen_use-1105-144548 (~/ase_lab/runs), skills/final = v155, digest 8c5d3c6fc0a0
  results: dev 71/144 (holds 71/108, tool uses 0/36), val 12/24 (v124 had 13/24), ~27 s a pick; the lab's REPORT.md
  ported_from: that final, copied 2026-11-06
  changes: the real pads' middle (0.118 m from the flange, the hand on its 27.25 mm holder; sim 0.091, measured on the robot 2026-11-06), the band the open fingers are sought in (2.7 cm out), a move's step cap (up to 300 steps while still progressing, was n+50, as in pick_up/chefbot_v30_fr3); and its whole-body calls made arm only (arm_only.py, wrapping the robot in main.run; act's rows to act_arm in the root frame, act_base to the arm holding its joints; the episode refuses act and act_base for an arm-only skill), and the close view (the wrist camera 0.30 m from the object, the lab's for a pole-chosen view) also for a wrist-chosen object over 0.45 m away, with the far view's measurement if that view can't be had (the real D405 flattens a small object beyond ~0.5 m, an egg at 0.70 m reading under half its height); nothing else
  real: "2026-11-06: the first run stopped at its first move (act refused, arm only), before arm_only.py"
