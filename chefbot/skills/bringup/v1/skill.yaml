name: bringup
version: v1
entry: main.py:run
interface: chefbot-v1
envs: [robocasa, mujoco_kitchen, real]  # robot: any; it only lifts the arm 3 cm and back
sandboxed: true
description: >-
  Check the arm works: read where it is, take one frame from each camera, lift the hand lift_m (a few cm) and back,
  open and close the gripper. Returns {ok, back_within_mm, cameras}: ok when the hand came back within 1 cm.
robot: any
arm_only: true
args:
  lift_m:
    type: number
    default: 0.03
    doc: how far up the flange goes and comes back (m)
models: {}
assumes: the arm free to move 3 cm up from where it is
privileged: false
provenance:
  written: by hand, 2026-11-03, to bring up environments/real/host.py on the real robot
