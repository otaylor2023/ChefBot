name: hand_eye_check
version: v1
entry: main.py:run
interface: chefbot-v1
envs: [real]
sandboxed: true
robot: tidybot_fr3
arm_only: true
cameras: [wrist, pole]
args:
  object: {type: string, default: purple chapstick cap, doc: "what to line the hand up with: small, on a surface, in the wrist view"}
  open_m: {type: number, default: 0.0254, doc: "how far open the gripper is (m; an inch)"}
  clearance_m: {type: number, default: 0.005, doc: "the fingertips' ends this far above its top (m)"}
  hold_s: {type: number, default: 5.0, doc: "how long the hand stays there (s)"}
  place_by: {type: string, default: wrist, doc: "whose estimate the hand lines up with ('wrist' or 'pole'); both are logged"}
models:
  grounding-dino: {runs: vision_models}
  sam2: {runs: vision_models}
assumes: the object on a surface in the wrist camera's view from the ready position (run_real --ready), within reach, nothing taller than it within a few cm; the hand wearing the printed fingers (tips 0.134 m out)
privileged: false
provenance:
  written: by hand, 2026-11-06, to check the wrist camera's calibration against the hand (the first kitchen_use run missed by 3.4 cm in height)
