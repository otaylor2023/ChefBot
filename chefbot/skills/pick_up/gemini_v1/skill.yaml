name: pick_up
version: gemini_v1
entry: main.py:run
interface: chefbot-v1
envs: [real]                          # written for environments/real/host.py
sandboxed: true
description: >-
  Pick up the named object (a few words: "apple", "red cup") from the surface in front of the arm: it goes to the
  ready pose (the hand pointing down), finds the object in the wrist camera, grasps it from above and lifts it 5 cm.
  Returns {ok, reason}: reason "held" when it holds it; otherwise why not (not seen, no depth at the point,
  closed on nothing, ...).
robot: tidybot_fr3
arm_only: true
cameras: [wrist]
args:
  object:
    type: string
    doc: what to pick up, in a few words
  force_n:
    type: number
    default: 20.0
    doc: the grasp's squeeze (N)
models:
  gemini-robotics-er-2-preview:
    runs: api
    provider: google
    key: GEMINI_API_KEY
assumes: the object under the wrist camera's view from where the arm starts (the ready pose), on a flat surface, small enough for a top-down grasp (under 7 cm across the fingers)
privileged: false
provenance:
  written: by hand, 2026-11-03, the first real-robot pick (environments/real/host.py)
