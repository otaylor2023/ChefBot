name: pick_up
version: run1_v32
entry: main.py:run
interface: wholebody-v2
sandboxed: true
robot: yam_tidybot
arm_only: true
args:
  object:
    type: string
    doc: what to pick up, in a few words
speed: fast                          # the profile it was tested at (`normal` until 10/27/2026)
models:
  gemini-3.1-flash-lite:  # chosen at run time from robot.models() (the cheapest), to check the object identity
    runs: api
    provider: google
    key: GEMINI_API_KEY
  grounding-dino:
    runs: vision_models
  sam2:
    runs: vision_models
assumes: the start rule of its lab's task
privileged: false
provenance:
  lab: robocasa_pick_functional
  run: pick_func1
  suite: robocasa_pick
  test: 97% (33/34), 15.6 s mean, 14.2 s median, $0.0003 (robocasa_pick/test, 4 jobs; the one failure lifted the coffee cup 15.8 cm but did not hold it); val 94% (17/18, twice), 16.9 s; not the lab final (it kept v9 on val)
  report: REPORT.md
imported_from: >-
  agentic-skills-exploration (skills/pick_up), unchanged. Built for the YAM TidyBot (94 mm gripper, a pole and a base
  camera) against wholebody-v2, picking from a low stool: it does not run on ChefBot's chefbot-v1 API as is. Kept as
  a starting point for ChefBot's pick labs (start_from).
