name: squeeze
version: robotapi_v1
entry: main.py:run
interface: robot-api-v1
envs:
- symbolic
- robocasa
sandboxed: false
robot: any
needs:
- trigger_tools
description: >-
  Squeeze the held tool's trigger or handles and keep squeezing: an egg cracker cracks the egg inside
  it into whatever it is over; an electric whisk runs for as long as you squeeze. This does not let go
  of the tool (that is place). Lower the tool into its container first.
args:
  wait:
    type: boolean
    description: >-
      true (default): block until the motion ends and return its result. false: return immediately with
      status "moving"; follow up with wait or get_status, or cancel with stop.
    default: true
provenance:
  written: the agent's squeeze tool (agent/tools/manip.py HandheldTools.squeeze), registered as a skill
    2026-11-05
