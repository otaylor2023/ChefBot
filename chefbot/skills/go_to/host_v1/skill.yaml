name: go_to
version: host_v1
entry: main.py:run
interface: host-v1
envs: [real]
sandboxed: false
description: >-
  Drive the base to one of the kitchen map's places (e.g. island_south, counter_north), or in front of an object on
  the KITCHEN map by its name (e.g. tomato, "bowl 2"): A* on the map, the robot's footprint kept clear, by mocap; the
  arm holds as it is. The base ends facing the counter, close up to it (for an object: squared up to the counter's
  side nearest it, where pick_up can reach it). Returns {ok, reason, at} (an object: also its side and how far off
  the stance the base stopped).
robot: tidybot_fr3
cameras: false
args:
  place: {type: string, doc: "a place of the map (maps/src_kitchen_work places.yaml / marked.yaml) or an object on the KITCHEN map"}
models: {}
assumes: launch.sh running (the base driver), live mocap, the arm in a pose it can drive with (READY)
privileged: false
provenance:
  written: "by hand, 2026-11-06, for the tomato demo (real_kitchen), from scripts/real_nav.py go_planned"
  changed: "2026-11-08: objects by name (the object map, perception/kitchen_map.py + goto.py)"
