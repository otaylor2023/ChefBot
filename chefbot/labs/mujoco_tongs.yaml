# Pick up a pair of kitchen tongs from the counter and use them to lift a named food (on the counter, or in a pan, a
# bowl or a plate), in RoboCasa kitchens exported to plain MuJoCo, on the TidyBot++ FR3 with the Franka Hand. Tongs
# from the tongs lab's final generator; some foods break if squeezed too hard (the breaking forces are hidden). A
# program that calls small models: Gemini and the vision models. Starts from the pick lab's v30.
goal: {skill: tongs_lift, task: lift}
robot: tidybot_fr3
interface: chefbot-v1
example: example_tongs
skill_args:
  object: {type: string, doc: "the food to lift, in a few words"}
  where: {type: string, doc: "where it is: 'on the counter', 'in the bowl', 'in the pan', 'in the plate'"}
  tool: {type: string, doc: "the tool to use: 'tongs'"}
suites:
  dev:  {suite: mujoco_tongs/dev,  visible: full}
  val:  {suite: mujoco_tongs/val,  visible: aggregate, submissions: 5}
  test: {suite: mujoco_tongs/test, visible: hidden}
paid_models: {google: {usd: 10}}
vision_models: [owlv2, grounding-dino, sam2]
budgets: {hours: 4, codex_usage_add_pct: 5}  # run 4: +5% (time-boxed: another lab runs at the same time)
brief: briefs/tongs_lift.md
start_from:
  skill: tongs_lift/mujoco_tongs3_v59
  files: [tongs_prior_v17/v17_main.py, tongs_prior_v17/v17_REPORT.md]
  note: >-
    `prior/skill/` is the reference skill (v59) of the previous session of this same lab, with its `prior/REPORT.md` and
    `prior/skill/research_log.md`: 12.5% and 8.3% on val (two submissions), 7/48 on dev, about 36 s an episode, written
    for the real Franka Hand's move and grasp. One thing has changed since then: robot.gripper_move now behaves as the
    real hand's does, pushing as hard as it must (up to 70 N) toward its width and, if something stops the fingers
    short, holding there as hard as it can, instead of backing off 1 cm (v59's log found moves would not hold the tongs'
    spring; now they do). `prior/v17_main.py` and `prior/v17_REPORT.md` are the session before that (29.2% on val, 14/48
    dev, about 44 s), on an older gripper that set a closure between open and closed: its way of squeezing the tongs to
    a chosen opening may now be possible with gripper_move widths. Same scenes and splits; the goal is still about
    20-30 s an episode at the best success you can get. Use, adapt or drop any of it; say in your report what you kept.
