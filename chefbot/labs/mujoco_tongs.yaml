# Pick up a pair of kitchen tongs from the counter and use them to lift a named food (on the counter, or in a pan, a
# bowl or a plate), in RoboCasa kitchens exported to plain MuJoCo, on the TidyBot++ FR3 with the Franka Hand. Tongs
# from the tongs lab's final generator; some foods break if squeezed too hard (the breaking forces are hidden). A
# program that calls small models: Gemini and the vision models. Starts from the pick lab's v30.
goal: {skill: tongs_lift, task: lift}
robot: tidybot_fr3
interface: chefbot-v1
example: example_tongs
skill_args:
  object: {type: string, doc: "the food to lift, in a few words"}
  where: {type: string, doc: "where it is: 'on the counter', 'in the bowl', 'in the pan', 'in the plate'"}
  tool: {type: string, doc: "the tool to use: 'tongs'"}
suites:
  dev:  {suite: mujoco_tongs/dev,  visible: full}
  val:  {suite: mujoco_tongs/val,  visible: aggregate, submissions: 5}
  test: {suite: mujoco_tongs/test, visible: hidden}
paid_models: {google: {usd: 10}}
vision_models: [owlv2, grounding-dino, sam2]
budgets: {hours: 6, codex_usage_add_pct: 25}
brief: briefs/tongs_lift.md
start_from:
  skill: tongs_lift/mujoco_tongs1_v34
  note: >-
    `prior/skill/` is the reference skill (v34) of an earlier session of this same lab, with its `prior/REPORT.md` and
    `prior/skill/research_log.md`. That session lost its episode runner 48 minutes in (the lab's fault: a worker ran
    out of memory, now fixed), so it ran few experiments: v34 picked up and held the tongs in 15 of 18 dev episodes
    but lifted no food (0/18; 3 foods broken, 10 never touched). Its report lists several prepared but untested
    changes. Same robot, scenes and splits. Use, adapt or drop any of it; say in your report what you kept.
