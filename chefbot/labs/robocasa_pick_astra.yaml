# GPT-6 Astra as the robot's only model, picking up a named object from a kitchen counter among others (RoboCasa),
# arm only, on the Panda with the Franka Hand (the real robot's arm and gripper). Same scenes and splits as
# robocasa_pick (the functional lab); starts from an earlier Astra pick policy on another robot.
goal: {skill: pick_up, task: pick}
robot: panda_franka
interface: chefbot-v1
arm_only: true
example: example_astra_pick
skill_args:
  object: {type: string, doc: "what to pick up, in a few words"}
suites:
  dev:  {suite: robocasa_pick/dev,  visible: full}
  val:  {suite: robocasa_pick/val,  visible: aggregate, submissions: 4}
  test: {suite: robocasa_pick/test, visible: hidden}
paid_models: {codex: gpt-6-astra}
vision_models: []
budgets: {hours: 5, codex_usage_add_pct: 20}
brief: briefs/pick_up_astra.md
start_from:
  skill: pick_up/astra_v19
  files: [prior/wholebody_v2.py]
  note: >-
    `prior/skill/` is the best Astra pick policy from an earlier lab on another robot (agentic-skills-exploration's
    pick_up/astra_v19: 94% on its test, 31.9 s mean). That lab differed: a YAM arm with a 94 mm gripper, a pole and a
    base camera, objects on a low stool, and its robot API, wholebody-v2 (`prior/wholebody_v2.py`; its flange axes
    differ from this lab's). It does not run here as is. Its approach and `prior/REPORT.md` are yours to use, adapt
    or drop; say in your report what you kept.
